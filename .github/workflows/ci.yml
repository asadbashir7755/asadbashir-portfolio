name: CI

# Vercel builds and deploys on push via its Git integration, so this workflow
# does not deploy. It exists to fail a pull request before Vercel ever builds
# it — typecheck, lint, and a real production build.
#
# The previous S3 + CloudFront deploy workflow was removed when the site moved
# to Vercel. It is still in git history if the AWS pipeline is ever restored.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
